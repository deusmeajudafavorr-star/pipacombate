name: Shrink kites once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  shrink:
    if: github.event.head_commit.message != 'Ajustar tamanho das pipas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar tamanho
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/utils/kites.ts')
          s = p.read_text()
          old = "const size = kite.shape === 'pipao' ? 36 : kite.shape === 'peixinho' ? 24 : 28;"
          new = "const size = kite.shape === 'pipao' ? 26 : kite.shape === 'peixinho' ? 18 : 22;"
          if old not in s:
              raise SystemExit('Linha de tamanho não encontrada')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commitar alteração
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/kites.ts
          git commit -m 'Ajustar tamanho das pipas'
          git push
          rm .github/workflows/shrink-kites.yml
          git add .github/workflows/shrink-kites.yml
          git commit -m 'Remover workflow temporário de ajuste'
          git push
